[package]
name = "finalpowershell"
version = "1.3.2"
edition = "2021"
rust-version = "1.90"
description = "A local-first remote operations workbench"
license = "MIT"

[lib]
name = "finalpowershell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "4.0.0"
ssh-key = { version = "=0.7.0-rc.12", features = ["ed25519", "rsa", "encryption"] }
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_Security",
] }
sha2 = "0.10"
tauri-plugin-dialog = "2.8.4"
anyhow = "1"
rand = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
rand_core = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

