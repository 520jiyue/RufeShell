name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.build.outputs.appVersion }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            assetPlatform: windows
            assetArch: x64
            signaturePlatform: windows
            signatureArch: x86_64
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            assetPlatform: windows
            assetArch: arm64
            signaturePlatform: windows
            signatureArch: aarch64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            assetPlatform: Linux
            assetArch: x64
            signaturePlatform: linux
            signatureArch: x86_64
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            assetPlatform: darwin
            assetArch: aarch64
            signaturePlatform: darwin
            signatureArch: aarch64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            assetPlatform: darwin
            assetArch: x64
            signaturePlatform: darwin
            signatureArch: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux packaging dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release packages
        uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RufeShell v__VERSION__
          releaseBody: |
            RufeShell is a modern SSH and local terminal workbench built with Rust and Tauri.

            - Windows: NSIS `.exe` and MSI `.msi` installers.
            - Linux: AppImage, Debian `.deb`, and RPM `.rpm` packages.
            - macOS: Apple Silicon and Intel `.dmg` installers and `.app.tar.gz` archives.

            Windows ConPTY and administrator tools require Windows; SSH, SFTP, monitoring, forwarding and other remote features remain available on other desktop platforms.

            RufeShell 是基于 Rust 与 Tauri 的现代化 SSH 与本地终端工作台。Windows 安装包支持直接安装；macOS 请根据芯片选择对应版本。
          releaseDraft: false
          prerelease: false
          assetNamePattern: RufeShell_v[version]_${{ matrix.assetPlatform }}_[arch][setup][ext]
          updaterJsonPreferNsis: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.runner == 'ubuntu-22.04' && '--bundles appimage,deb,rpm' || '' }}
          retryAttempts: 2

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rufeshell-${{ matrix.signaturePlatform }}-${{ matrix.signatureArch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Package signatures and updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
        run: |
          npm install --no-save adm-zip @octokit/rest
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import AdmZip from 'adm-zip';
          import { Octokit } from '@octokit/rest';

          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const tag = process.env.RELEASE_TAG;
          const version = tag.replace(/^v/, '');
          const release = (await octokit.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
          const assets = (await octokit.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id, per_page: 100 })).data;
          const manifest = { version, notes: release.body, pub_date: new Date().toISOString(), platforms: {} };
          const signatures = fs.globSync('packages/**/*.sig').map(file => path.resolve(file));

          for (const signaturePath of signatures) {
            const bundlePath = signaturePath.slice(0, -4);
            const directory = signaturePath.split(path.sep).find(part => /^rufeshell-(windows|linux|darwin)-(x86_64|aarch64)$/.test(part));
            if (!directory) throw new Error(`Unknown artifact directory: ${signaturePath}`);
            const [, platform, arch] = directory.match(/^rufeshell-(windows|linux|darwin)-(x86_64|aarch64)$/);
            const assetName = path.basename(bundlePath).replace(/^RufeShell_/, `RufeShell_v${version}_${platform}_`);
            const asset = assets.find(item => item.name === assetName);
            if (!asset) throw new Error(`Missing release package for ${path.basename(bundlePath)}`);
            const bundle = signaturePath.includes('.app.tar.gz') ? 'app' : signaturePath.includes('.AppImage') ? 'appimage' : signaturePath.endsWith('.exe.sig') ? 'nsis' : signaturePath.endsWith('.msi.sig') ? 'msi' : path.extname(bundlePath).slice(1);
            const entry = { signature: fs.readFileSync(signaturePath, 'utf8'), url: asset.browser_download_url };
            manifest.platforms[`${platform}-${arch}-${bundle}`] = entry;
            if (['nsis', 'app', 'appimage'].includes(bundle)) manifest.platforms[`${platform}-${arch}`] = entry;
          }

          for (const directory of fs.readdirSync('packages')) {
            const match = directory.match(/^rufeshell-(windows|linux|darwin)-(x86_64|aarch64)$/);
            if (!match) continue;
            const [, platform, arch] = match;
            const zip = new AdmZip();
            for (const file of signatures.filter(file => file.includes(`${directory}${path.sep}`))) zip.addLocalFile(file);
            zip.writeZip(`RufeShell_v${version}_${platform}_${arch}-Signatures.zip`);
          }

          for (const asset of assets) {
            if (asset.name.endsWith('.sig') || asset.name === 'latest.json' || asset.name.endsWith('-Signatures.zip')) {
              await octokit.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
          }

          for (const directory of fs.readdirSync('packages')) {
            const match = directory.match(/^rufeshell-(windows|linux|darwin)-(x86_64|aarch64)$/);
            if (!match) continue;
            const [, platform, arch] = match;
            const name = `RufeShell_v${version}_${platform}_${arch}-Signatures.zip`;
            const data = fs.readFileSync(name);
            await octokit.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data, headers: { 'content-type': 'application/zip', 'content-length': data.length } });
          }

          const data = Buffer.from(JSON.stringify(manifest, null, 2));
          await octokit.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name: 'latest.json', data, headers: { 'content-type': 'application/json', 'content-length': data.length } });
          EOF


