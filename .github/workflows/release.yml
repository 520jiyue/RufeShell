name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            assetPlatform: windows
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            assetPlatform: windows
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            assetPlatform: Linux
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            assetPlatform: darwin
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            assetPlatform: darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux packaging dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RufeShell v__VERSION__
          releaseBody: |
            RufeShell is a modern SSH and local terminal workbench built with Rust and Tauri.

            - Windows: NSIS `.exe` and MSI `.msi` installers.
            - Linux: AppImage, Debian `.deb`, and RPM `.rpm` packages.
            - macOS: Apple Silicon and Intel `.dmg` installers and `.app.tar.gz` archives.

            Windows ConPTY and administrator tools require Windows; SSH, SFTP, monitoring, forwarding and other remote features remain available on other desktop platforms.

            RufeShell 是基于 Rust 与 Tauri 的现代化 SSH 与本地终端工作台。Windows 安装包支持直接安装；macOS 请根据芯片选择对应版本。
          releaseDraft: false
          prerelease: false
          assetNamePattern: RufeShell_v[version]_${{ matrix.assetPlatform }}_[arch][setup][ext]
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} ${{ matrix.runner == 'ubuntu-22.04' && '--bundles appimage,deb,rpm' || '' }}
          retryAttempts: 2

