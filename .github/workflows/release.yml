name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.build.outputs.appVersion }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            assetPlatform: windows
            assetArch: x64
            signaturePlatform: windows
            signatureArch: x86_64
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            assetPlatform: windows
            assetArch: arm64
            signaturePlatform: windows
            signatureArch: aarch64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            assetPlatform: linux
            assetArch: x64
            signaturePlatform: linux
            signatureArch: x86_64
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            assetPlatform: darwin
            assetArch: aarch64
            signaturePlatform: darwin
            signatureArch: aarch64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            assetPlatform: darwin
            assetArch: x64
            signaturePlatform: darwin
            signatureArch: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux packaging dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release packages
        uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RufeShell v__VERSION__
          releaseBody: |
            RufeShell is a modern SSH and local terminal workbench built with Rust and Tauri.

            - Windows: x64/ARM64 NSIS installers and an x64 portable archive.
            - Linux: AppImage and Debian packages for x64 systems.
            - macOS: Apple Silicon and Intel `.dmg` installers and `.app.tar.gz` archives.

            Windows ConPTY and administrator tools require Windows; SSH, SFTP, monitoring, forwarding and other remote features remain available on other desktop platforms.

            RufeShell 是基于 Rust 与 Tauri 的现代化 SSH 与本地终端工作台。Windows 安装包支持直接安装；macOS 请根据芯片选择对应版本。
          releaseDraft: false
          prerelease: false
          assetNamePattern: RufeShell_v[version]_${{ matrix.assetPlatform }}_[arch][setup][ext]
          updaterJsonPreferNsis: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.runner == 'windows-latest' && '--bundles nsis' || matrix.runner == 'ubuntu-22.04' && '--bundles appimage,deb' || '' }}
          retryAttempts: 2

      - name: Package Windows x64 portable archive
        if: matrix.assetPlatform == 'windows' && matrix.assetArch == 'x64'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $executable = Get-Item "src-tauri/target/${{ matrix.target }}/release/finalpowershell.exe"
          $archive = "src-tauri/target/${{ matrix.target }}/release/bundle/RufeShell_v${version}_windows_x64-portable.zip"
          Compress-Archive -LiteralPath $executable.FullName -DestinationPath $archive

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rufeshell-${{ matrix.signaturePlatform }}-${{ matrix.signatureArch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Package signatures and updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
        run: |
          npm install --no-save @octokit/rest
          node .github/finalize-release.mjs


